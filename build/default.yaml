recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"
schema_list:
  - schema: wubi
  - schema: wubi_pinyin
  - schema: pinyin
switch_key:
  Caps_Lock: noop
  Control_L: noop
  Control_R: noop
  Eisu_toggle: clear
  Shift_L: noop
  Shift_R: noop
switcher:
  abbreviate_options: true
  caption: "〈菜单项〉"
  fold_options: true
  hotkeys:
    - "Control+grave"
    - "Control+Shift+grave"
  option_list_separator: "／"
  save_options:
